services:
  api-1:
    build:
      context: ./app
    image: content-processing-api:1.0
    ports:
      - "3001:3000"
    environment:
      APP_VERSION: "1.0"
      INSTANCE_ID: "api-1"
    networks:
      - platform-network

  api-2:
    image: content-processing-api:1.0
    ports:
      - "3002:3000"
    environment:
      APP_VERSION: "1.0"
      INSTANCE_ID: "api-2"
    networks:
      - platform-network

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: content_platform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d content_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge

volumes:
  postgres-data: